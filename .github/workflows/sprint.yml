name: Sprint (fast polling)

# The scheduled watcher polls every 10 minutes, which is fine for "some time
# this month" but too slow if you know the system opens today and rooms are
# first come, first served. Start this manually and it polls every 30 seconds
# for up to 6 hours, booking the instant the system opens.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep polling (max 350)"
        default: "300"
      interval:
        description: "Seconds between polls"
        default: "30"
      dry_run:
        description: "Dry run (find rooms but book nothing)"
        type: boolean
        default: false

concurrency:
  group: room-booking
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # GitHub hard-stops a job at 6 hours
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll hard until it opens
        env:
          WRB_USERNAME: ${{ secrets.WRB_USERNAME }}
          WRB_PASSWORD: ${{ secrets.WRB_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAG="--confirm"
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG=""; fi
          python run.py $FLAG --loop \
            --interval "${{ inputs.interval }}" \
            --max-minutes "${{ inputs.minutes }}"

      - name: Remember what was booked
        if: always()
        run: |
          git config user.name  "room-booking-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "state: sprint booking update [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected (attempt $i/5); rebasing onto latest and retrying"
              git pull --rebase origin "$GITHUB_REF_NAME"
              sleep $((i * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push state.json after 5 attempts - a booking may not be recorded"
              exit 1
            fi
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Sprint: run failed ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body "This run failed before it could send its normal notification: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
