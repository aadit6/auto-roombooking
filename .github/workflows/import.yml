name: 3. Import from spreadsheet

# The bulk version of "2. Change what gets booked". Export your spreadsheet
# as CSV, then on this repo's GitHub page: Add file -> Upload files -> drop
# it in as bookings.csv -> Commit changes. No git, no editor, no code. This
# workflow then turns every row into a one-off booking automatically.
#
# See bookings.example.csv for the columns it expects.
on:
  push:
    paths:
      - "bookings.csv"
  workflow_dispatch:
    inputs:
      append:
        description: "Add to existing patterns instead of replacing them"
        type: boolean
        default: false
      default_reason:
        description: "Fallback reason for rows that leave 'reason' blank (leave blank to keep whatever is already set)"
        default: ""

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Import bookings.csv
        env:
          DEFAULT_REASON: ${{ inputs.default_reason }}
        run: |
          FLAG=""
          if [ "${{ inputs.append }}" = "true" ]; then FLAG="--append"; fi
          python import_csv.py $FLAG

      - name: Save it
        run: |
          git config user.name  "room-booking-bot"
          git config user.email "actions@github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "config unchanged"
          else
            git commit -m "config: bulk-imported from bookings.csv [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected (attempt $i/5); rebasing onto latest and retrying"
              git pull --rebase origin "$GITHUB_REF_NAME"
              sleep $((i * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push config.json after 5 attempts"
              exit 1
            fi
          fi
