name: Watch and book

# Polls the booking system. While it is closed each run costs a few seconds.
# The moment it opens, this emails you and books everything in config.json.
on:
  schedule:
    # Every 10 minutes, offset off round numbers. This repo is public, so
    # Actions minutes are free/unmetered on standard runners - no billing
    # concern at this cadence. GitHub's schedule trigger is still
    # best-effort and queues get backed up most at round numbers
    # (everyone else's cron fires there too), so offsetting off :00/:10/
    # :20/... tends to reduce delay.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (find rooms but book nothing)"
        type: boolean
        default: false

# Two overlapping runs could book the same slot twice. Never let that happen.
concurrency:
  group: room-booking
  cancel-in-progress: false

permissions:
  contents: write      # commit state.json back so bookings are remembered
  issues: write        # notification fallback (GitHub emails you the issue)

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # one poll cycle; a hung run must not block the next few
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll, and book if open
        env:
          WRB_USERNAME: ${{ secrets.WRB_USERNAME }}
          WRB_PASSWORD: ${{ secrets.WRB_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py
          else
            python run.py --confirm
          fi

      - name: Remember what was booked
        if: always()
        run: |
          git config user.name  "room-booking-bot"
          git config user.email "actions@github.com"

          # Touch the heartbeat only as the last commit approaches GitHub's
          # 60-day scheduled-workflow disable threshold - not every run, or
          # this commits (and pushes) on every single 10-minute tick forever.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3888000 ]; then   # 45 days
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          fi

          # Separate commands: `git add a b` validates every pathspec before
          # staging anything, so one missing file would silently stage
          # nothing (and used to be masked by `2>/dev/null || true`).
          git add state.json
          if [ -f .heartbeat ]; then
            git add .heartbeat
          fi

          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "state: booking update [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected (attempt $i/5); rebasing onto latest and retrying"
              git pull --rebase origin "$GITHUB_REF_NAME"
              sleep $((i * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push state.json after 5 attempts - a booking may not be recorded"
              exit 1
            fi
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Watch and book: run failed ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body "This run failed before it could send its normal notification: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
